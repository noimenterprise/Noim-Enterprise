<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noim Enterprise | Welcome</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
    }

    h1 {
      color: var(--heading);
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
      margin-bottom: 24px;
      color: #8b949e;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Noim Enterprise</h1>
    <p>This is a starter demo page deployed via GitHub. You can customize the styles, add your content, and build out your application here.</p>
    <a href="#" class="btn">Explore Projects</a>
  </div>
</body>
</html>
